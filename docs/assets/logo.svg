<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Tidepull: a curling wave whose crest feeds a downward pull arrow -->
  <defs>
    <linearGradient id="tide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="20" fill="#0B0D10"/>
  <!-- wave crest, curling over to the left -->
  <path d="M 24 38
           C 24 28, 34 22, 48 22
           C 64 22, 74 30, 74 42
           C 74 50, 68 56, 60 56
           C 66 56, 70 52, 70 46
           C 70 39, 62 34, 50 34
           C 38 34, 30 36, 24 38 Z"
        fill="url(#tide)"/>
  <!-- stem pulled straight down from the crest -->
  <rect x="55" y="52" width="7" height="18" rx="3" fill="url(#tide)"/>
  <!-- arrowhead pointing straight down -->
  <path d="M 46 68 L 70 68 L 58 82 Z" fill="#22D3EE"/>
</svg>
